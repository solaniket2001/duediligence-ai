services:
  postgres:
    image: postgres:15
    container_name: argus-postgres
    restart: unless-stopped
    network_mode: "host"
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-duediligence}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-duediligence}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: argus-api
    command: uvicorn src.api.server:app --host 0.0.0.0 --port 8001
    restart: unless-stopped
    network_mode: "host"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@127.0.0.1:5432/${POSTGRES_DB:-duediligence}
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./data:/app/data
      - ./src:/app/src
      - model_cache:/tmp
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: argus-web
    restart: unless-stopped
    network_mode: "host"
    environment:
      API_INTERNAL_URL: http://127.0.0.1:8001
    volumes:
      - ./web/src:/app/src
    depends_on:
      - api

volumes:
  postgres_data:
  model_cache: