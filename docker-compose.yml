version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: argus-postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: argus
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d argus"]
      interval: 5s
      timeout: 5s
      retries: 5

  chromadb:
    image: chromadb/chroma:latest
    container_name: argus-chroma
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: argus-api
    restart: always
    # BYPASS THE DOCKER NETWORK ENTIRELY
    network_mode: "host"
    env_file:
      - .env
    environment:
      - CHROMA_SERVER_HOST=localhost
      - CHROMA_SERVER_HTTP_PORT=8000
    depends_on:
      postgres:
        condition: service_healthy
    # Force the API to run on 8001 so it doesn't clash with Chroma on 8000
    command: ["uvicorn", "src.api.server:app", "--host", "0.0.0.0", "--port", "8001"]

volumes:
  postgres_data:
  chroma_data: